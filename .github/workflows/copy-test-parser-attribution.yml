name: Copy-test parser attribution

on:
  push:
    branches:
      - html-modularization-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Attribute parser errors through CDP
        run: node copy-test/test/cdp-parser-attribution.browser.test.js
