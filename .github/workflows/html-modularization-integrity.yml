name: HTML modularization integrity

on:
  push:
    branches:
      - html-modularization-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check html.js
          node --check html.button.js
          node --check html.prompt.js
          node --check html.plate.js
      - name: Install browser qualification dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run modularization structural integrity
        run: node test/html-modularization.browser.test.js
      - name: Run exhaustive copy-test interaction qualification
        if: always()
        run: node copy-test/test/full-site.browser.test.js
      - name: Attribute legacy browser script collisions
        if: always()
        run: node copy-test/test/script-collision.browser.test.js
      - name: Correlate normal script loading with parser errors
        if: always()
        run: node copy-test/test/script-load-error-correlation.browser.test.js
      - name: Attribute full-page browser errors
        if: always()
        run: node copy-test/test/page-error-attribution.browser.test.js
      - name: Upload copy-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-test-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - name: Verify isolated ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'classList\.(add|remove|toggle).*open|plate-transition-(in|out)' html.js html.button.js html.prompt.js html.plate.js
          ! grep -Eq 'HaamuWebText|WebGL|WebGPU|canvas|getContext' html.js html.button.js html.prompt.js html.plate.js
          ! grep -Eq 'addEventListener' html.button.js html.plate.js
          grep -q "className: 'corner-menu'" html.plate.js
          grep -q "className: 'plate-prompt'" html.prompt.js
          grep -q "'corner start" browser.js
