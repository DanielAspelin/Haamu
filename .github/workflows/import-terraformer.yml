name: Import Terraformer snapshot
on:
  push:
    branches: [html-modularization-experiment]
    paths: [.github/workflows/import-terraformer.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: html-modularization-experiment
          fetch-depth: 0
      - name: Copy Terraformer main into root Terraformer directory
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Terraformer
          git clone --depth 1 https://github.com/DanielAspelin/Terraformer.git /tmp/terraformer
          rm -rf /tmp/terraformer/.git
          mkdir Terraformer
          cp -a /tmp/terraformer/. Terraformer/
          rm .github/workflows/import-terraformer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Terraformer .github/workflows/import-terraformer.yml
          git commit -m "Import Terraformer repository snapshot"
          git push origin HEAD:html-modularization-experiment
