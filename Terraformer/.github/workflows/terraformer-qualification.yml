name: Terraformer Qualification

on:
  push:
    branches: [main, qualify-runtime-v0.48.50]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraformer-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find site -type f -name '*.js' -print0 | sort -z)

      - name: JSON validity
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$file"
          done < <(find site -type f -name '*.json' -print0 | sort -z)

      - name: Canonical entry
        run: node site/terraformer.js

      - name: Canonical description
        run: node site/terraformer.js --describe

      - name: Compatibility runtime
        run: node site/terraformer.js --temporary
