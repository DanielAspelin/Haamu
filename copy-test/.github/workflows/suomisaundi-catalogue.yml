name: Suomisaundi Catalogue Qualification

on:
  push:
    branches: [main]
    paths:
      - 'Suomisaundi/**'
      - '.github/workflows/suomisaundi-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run catalogue invariants
        run: node Suomisaundi/Tests/catalogue.invariants.js
