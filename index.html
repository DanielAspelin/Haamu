<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Haamu — open community, technology and culture">
  <title>Haamu</title>
  <style>
    :root{color-scheme:dark;background:#07090c;color:#f5f7fa}
    *{box-sizing:border-box}
    html,body,#haamu-root{margin:0;width:100%;min-height:100%;height:100%}
    body{overflow:hidden;background:#07090c}
    button{font:inherit}
    .haamu-interface{
      --corner:clamp(52px,5.5vw,76px);
      position:absolute;
      inset:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
      width:auto;height:auto;min-width:0;min-height:0;display:grid;
      grid-template-columns:var(--corner) 1fr var(--corner);
      grid-template-rows:var(--corner) 1fr var(--corner);
      grid-template-areas:
        "tl top tr"
        "left center right"
        "bl bottom br";
      gap:0;background:#07090c;
    }
    .corner{
      border:0;margin:0;cursor:pointer;position:relative;
      background-color:rgba(var(--corner-rgb),.68);
      background-image:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.06) 42%,rgba(0,0,0,.10));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.18);
      backdrop-filter:blur(14px) saturate(150%);
      -webkit-backdrop-filter:blur(14px) saturate(150%);
      z-index:3;transition:background-color .16s ease,box-shadow .16s ease,filter .16s ease,transform .12s ease;
    }
    .corner:hover,.corner:focus-visible{
      background-color:rgba(var(--corner-rgb),.82);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 0 22px rgba(var(--corner-rgb),.28);
      filter:brightness(1.08);
      outline:none;
    }
    .corner:active{transform:scale(.94)}
    .corner.morphing{animation:haamu-corner-morph .42s cubic-bezier(.16,1,.3,1)}
    @keyframes haamu-corner-morph{
      0%{transform:scale(1);border-radius:0}
      42%{transform:scale(.72);border-radius:28%}
      72%{transform:scale(1.08);border-radius:10%}
      100%{transform:scale(1);border-radius:0}
    }
    /* Corner controls are explicitly snapped to the structural viewport corners. */
    .neon-green{grid-area:tl;align-self:start;justify-self:start;--corner-rgb:57,255,20}
    .lemon-yellow{grid-area:tr;align-self:start;justify-self:end;--corner-rgb:255,244,79}
    .purple{grid-area:bl;align-self:end;justify-self:start;--corner-rgb:157,53,255}
    .orange{grid-area:br;align-self:end;justify-self:end;--corner-rgb:255,140,26}
    .corner-menu{
      --plate-inline:calc(100% - (var(--corner) * .82) - 20px);
      --plate-block:calc(100% - (var(--corner) * .82) - 32px);
      position:absolute;
      width:var(--plate-inline);height:var(--plate-block);
      z-index:2;pointer-events:none;opacity:0;border-radius:12px;
      background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.20);
      backdrop-filter:blur(18px) saturate(145%);
      -webkit-backdrop-filter:blur(18px) saturate(145%);
      transition:opacity .32s ease,transform .52s cubic-bezier(.16,1,.3,1);
    }
    .corner-menu[data-corner="top-left"]{top:12px;left:4px;right:auto;bottom:auto;transform-origin:top left;transform:scale(.18)}
    .corner-menu[data-corner="top-right"]{top:12px;right:4px;left:auto;bottom:auto;transform-origin:top right;transform:scale(.18)}
    .corner-menu[data-corner="bottom-left"]{bottom:12px;left:4px;right:auto;top:auto;transform-origin:bottom left;transform:scale(.18)}
    .corner-menu[data-corner="bottom-right"]{bottom:12px;right:4px;left:auto;top:auto;transform-origin:bottom right;transform:scale(.18)}
    .corner-menu.open{opacity:1;pointer-events:auto;transform:scale(1)}
    @media(max-width:600px){
      .corner-menu{
        --plate-inline:calc(100% - (var(--corner) * .82) - 20px);
        --plate-block:calc(100% - (var(--corner) * .82) - 32px);
      }
    }
    @media(min-width:901px) and (pointer:fine){
      .corner-menu{
        --plate-inline:min(46vw,735px);
        --plate-block:min(46vh,460px);
      }
    }
    .pane{
      position:relative;border:0;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
      opacity:0;box-shadow:none;background:transparent;
      backdrop-filter:none;-webkit-backdrop-filter:none;
      transition:none;
    }
    .pane:hover,.pane:focus-within{opacity:0}
    .top-pane{grid-area:top}
    .left-pane{grid-area:left}
    .right-pane{grid-area:right}
    .bottom-pane{grid-area:bottom}
    .center{grid-area:center;background:#07090c;min-width:0;min-height:0}
    @media(max-width:600px){.haamu-interface{--corner:48px}}
    /* Invisible structural viewport lattice: composition only, never rendered. */
    .haamu-interface{
      --split-x:50%;--split-y:50%;
      --region-full:inset(0);
      --region-left:inset(0 50% 0 0);--region-right:inset(0 0 0 50%);
      --region-top:inset(0 0 50% 0);--region-bottom:inset(50% 0 0);
      --region-top-left:inset(0 50% 50% 0);--region-top-right:inset(0 0 50% 50%);
      --region-bottom-left:inset(50% 50% 0 0);--region-bottom-right:inset(50% 0 0 50%);
    }
    .structural-split{position:fixed;z-index:1;pointer-events:none;visibility:hidden;opacity:0}
    .structural-split.vertical{top:0;bottom:0;left:var(--split-x);width:0}
    .structural-split.horizontal{left:0;right:0;top:var(--split-y);height:0}
    .pane-layer{position:fixed;inset:0;z-index:1;pointer-events:none;visibility:hidden;opacity:0}
    .pane-layer .pane-region{position:absolute;pointer-events:none}
    .pane-layer .pane-left{inset:0 50% 0 0}
    .pane-layer .pane-up{inset:0 0 50% 0}
    .pane-layer .pane-right{inset:0 0 0 50%}
    .pane-layer .pane-down{inset:50% 0 0 0}
    @media(prefers-reduced-motion:reduce){.corner,.pane,.corner-menu{transition:none}}
  </style>
</head>
<body>
  <i class="structural-split vertical" aria-hidden="true"></i>
  <i class="structural-split horizontal" aria-hidden="true"></i>
  <div class="pane-layer" aria-hidden="true">
    <i class="pane-region pane-left"></i>
    <i class="pane-region pane-up"></i>
    <i class="pane-region pane-right"></i>
    <i class="pane-region pane-down"></i>
  </div>
  <div id="haamu-root"><noscript>Haamu requires JavaScript for its runtime projection.</noscript></div>
  <script src="entry.pre.js"></script>
  <script src="entry.post.js"></script>
  <script src="index.js"></script>
  <script src="default.js"></script>
  <script src="haamu.js"></script>
  <script src="browser.entry.js"></script>
  <script src="browser.js"></script>
  <script src="web.entry.js"></script>
  <script src="web.js"></script>
</body>
</html>
