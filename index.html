<!doctype html>
<html lang="en">
<head>

  <title>Haamu</title>
  <meta name="description" content="Haamu — haamu.space">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #f4f7fb; }
    main { width: min(720px, 90vw); padding: 48px; border: 1px solid #2a3038; border-radius: 24px; background: #11151a; }
    h1 { margin: 0 0 12px; font-size: clamp(3rem, 10vw, 6rem); letter-spacing: -0.05em; }
    p { margin: 0; color: #b9c1cc; font-size: 1.1rem; line-height: 1.6; }
    .domain { margin-top: 28px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Haamu</h1>
    <p>GitHub Pages deployment surface for the Haamu project.</p>
    <p class="domain">haamu.space</p>
  </main>
</body>
</html>
