<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Haamu — open community, technology and culture">
  <title>Haamu</title>
  <style>
    :root{color-scheme:dark;background:#07090c;color:#f5f7fa}
    *{box-sizing:border-box}
    html,body,#haamu-root{margin:0;width:100%;min-height:100%;height:100%}
    body{overflow:hidden;background:#07090c}
    button{font:inherit}
    .haamu-interface{
      --corner:clamp(52px,5.5vw,76px);
      --edge:clamp(64px,8vh,92px);
      width:100vw;height:100vh;display:grid;
      grid-template-columns:var(--corner) 1fr var(--corner);
      grid-template-rows:var(--corner) 1fr var(--corner);
      grid-template-areas:
        "tl top tr"
        "left center right"
        "bl bottom br";
      gap:0;background:#07090c;
    }
    .corner{border:0;margin:0;cursor:pointer;position:relative;transition:filter .12s ease,transform .12s ease}
    .corner:hover,.corner:focus-visible{filter:brightness(1.18);outline:2px solid rgba(255,255,255,.8);outline-offset:-5px}
    .corner:active{transform:scale(.94)}
    .neon-green{grid-area:tl;background:#39ff14}
    .lemon-yellow{grid-area:tr;background:#fff44f}
    .purple{grid-area:bl;background:#9d35ff}
    .orange{grid-area:br;background:#ff8c1a}
    .pane{background:#0d1116;border-color:#27303a;border-style:solid;position:relative}
    .top-pane{grid-area:top;border-width:0 1px 1px}
    .left-pane{grid-area:left;border-width:1px 1px 1px 0}
    .right-pane{grid-area:right;border-width:1px 0 1px 1px}
    .bottom-pane{grid-area:bottom;border-width:1px 1px 0}
    .center{grid-area:center;background:#07090c;min-width:0;min-height:0}
    @media(max-width:600px){
      .haamu-interface{--corner:48px}
    }
  </style>
</head>
<body>
  <div id="haamu-root"><noscript>Haamu requires JavaScript for its runtime projection.</noscript></div>
  <script src="entry.pre.js"></script>
  <script src="entry.post.js"></script>
  <script src="index.js"></script>
  <script src="default.js"></script>
  <script src="haamu.js"></script>
  <script src="browser.entry.js"></script>
  <script src="browser.js"></script>
  <script src="web.entry.js"></script>
  <script src="web.js"></script>
</body>
</html>
