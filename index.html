<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="haamu-build" content="0.138.19">
  <meta name="description" content="Haamu — open community, technology and culture">
  <title>Haamu</title>
  <style>
    @font-face{
      font-family:'Rajdhani';
      src:url('./fonts/rajdhani/Rajdhani-SemiBold.ttf') format('truetype');
      font-style:normal;
      font-weight:600;
      font-display:swap;
    }
    :root{--haamu-sky:#071019;--haamu-sky-gradient:radial-gradient(circle at 50% 38%,#203349 0,#0c1723 35%,#050b12 78%);color-scheme:dark;background:var(--haamu-sky);color:#f5f7fa}
    *{box-sizing:border-box}
    html,body,#haamu-root{margin:0;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}
    html,body{position:fixed;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;touch-action:manipulation}
    #haamu-root{position:absolute;inset:0;width:auto;height:auto;overflow:visible}
    body{overscroll-behavior:none;background:var(--haamu-sky-gradient),var(--haamu-sky)}
    button{font:inherit}
    .haamu-interface{
      --corner:clamp(52px,5.5vw,76px);
      position:absolute;
      inset:0;
      overflow:visible;
      width:auto;height:auto;min-width:0;min-height:0;display:grid;
      grid-template-columns:var(--corner) 1fr var(--corner);
      grid-template-rows:var(--corner) 1fr var(--corner);
      grid-template-areas:
        "tl top tr"
        "left center right"
        "bl bottom br";
      gap:0;background:var(--haamu-sky-gradient),var(--haamu-sky);
    }
    .haamu-wordmark-layer{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    /* Canonical Haamu text projection shared by mobile and desktop. */
    .haamu-wordmark{
      margin:0;
      font-family:'Rajdhani',sans-serif;
      font-size:clamp(39px,8.4vw,104px);
      font-style:normal;font-weight:600;
      line-height:1;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#55aaff;
      -webkit-text-fill-color:#55aaff;
      -webkit-text-stroke:3px #fff;
      paint-order:stroke fill;
      filter:
        drop-shadow(0 0 2px rgba(255,255,255,1))
        drop-shadow(0 0 6px rgba(255,255,255,.95))
        drop-shadow(0 0 12px rgba(190,225,255,.92))
        drop-shadow(0 0 24px rgba(80,165,255,.78))
        drop-shadow(0 0 42px rgba(35,105,225,.58));
      text-shadow:
        0 0 1px #fff,
        0 0 4px rgba(255,255,255,1),
        0 0 10px rgba(190,225,255,.95),
        0 0 22px rgba(85,165,255,.82);
      user-select:none;
    }
    /* Mobile keeps the qualified size. Desktop receives its own explicit
       class from the runtime so CSS viewport/input heuristics cannot mask it. */
    .haamu-interface.haamu-desktop .haamu-wordmark{
      font-size:32px !important;
      letter-spacing:.12em;
    }
    .corner{
      --corner-rgb:0,0,0;
      width:calc(100% - 1mm);height:calc(100% - 1mm);
      opacity:.85;
      border:0;margin:0;cursor:pointer;position:relative;
      border-radius:10px;
      background-color:rgba(var(--corner-rgb),.68);
      background-image:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.06) 42%,rgba(0,0,0,.10));
      /* Body layer only. Aura is independently owned by ::before. */
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.18);
      backdrop-filter:blur(14px) saturate(150%);
      -webkit-backdrop-filter:blur(14px) saturate(150%);
      z-index:3;isolation:isolate;transition:background-color .16s ease,box-shadow .16s ease,filter .16s ease,transform .12s ease;
    }
    /* Independent cold-blue aura layer. It does not participate in button
       sizing/anchoring and can be tuned without changing control geometry. */
    .corner::before{
      content:"";
      display:block;
      position:absolute;
      z-index:-1;
      inset:-5px;
      border-radius:14px;
      pointer-events:none;
      background:rgba(130,190,255,.14);
      box-shadow:
        0 0 10px 4px rgba(190,225,255,.74),
        0 0 22px 8px rgba(85,165,255,.52),
        0 0 38px 13px rgba(35,105,225,.36);
      transform:none;
      animation:none;
      filter:none;
    }
    .corner:hover,.corner:focus-visible{
      background-color:rgba(var(--corner-rgb),.82);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 0 22px rgba(var(--corner-rgb),.28);
      filter:brightness(1.08);
      outline:none;
    }
    .corner:active{transform:scale(.94)}
    .corner{
      animation:haamu-corner-breathe 4.8s linear infinite;
    }
    /* Four equal 1.2 s quarters: green -> yellow -> orange -> purple. */
    .neon-green{animation-delay:0s}
    .lemon-yellow{animation-delay:1.2s}
    .orange{animation-delay:2.4s}
    .purple{animation-delay:3.6s}
    @keyframes haamu-corner-breathe{
      0%,24%{
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
      8%{
        background-color:rgba(var(--corner-rgb),.42);
        filter:brightness(.66);
      }
      16%{
        background-color:rgba(var(--corner-rgb),.98);
        filter:brightness(1.42);
      }
      25%,100%{
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
    }
    .corner.morphing{animation:haamu-corner-morph .58s cubic-bezier(.16,1,.3,1)}
    @keyframes haamu-corner-morph{
      0%{
        transform:scale(1);border-radius:0;
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
      34%{
        transform:scale(.90);border-radius:22%;
        background-color:rgba(var(--corner-rgb),.36);
        filter:brightness(.58);
        box-shadow:inset 0 0 18px rgba(0,0,0,.48);
      }
      70%{
        transform:scale(1.05);border-radius:8%;
        background-color:rgba(var(--corner-rgb),.96);
        filter:brightness(1.48);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 0 28px rgba(var(--corner-rgb),.48);
      }
      100%{
        transform:scale(1);border-radius:0;
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
    }
    /* Canonical corner snapping system.
       Grid areas select the corner cell; physical inset properties snap each
       control to that cell's actual corner without transforms or offsets. */
    .corner[data-snap="top-left"]{align-self:start;justify-self:start;inset-block-start:0;inset-inline-start:0}
    .corner[data-snap="top-right"]{align-self:start;justify-self:end;inset-block-start:0;inset-inline-end:0}
    .corner[data-snap="bottom-left"]{align-self:end;justify-self:start;inset-block-end:0;inset-inline-start:0}
    .corner[data-snap="bottom-right"]{align-self:end;justify-self:end;inset-block-end:0;inset-inline-end:0}
    /* Grid-area ownership snaps each full-size control to its corner cell. */
    .neon-green{grid-area:tl;align-self:start;justify-self:start;margin:0;border-radius:0 10px 10px 10px;--corner-rgb:0,0,0}
    .lemon-yellow{grid-area:tr;align-self:start;justify-self:end;margin:0;border-radius:10px 0 10px 10px;--corner-rgb:0,0,0}
    .purple{grid-area:bl;align-self:end;justify-self:start;margin:0;border-radius:10px 10px 10px 0;--corner-rgb:0,0,0}
    .orange{grid-area:br;align-self:end;justify-self:end;margin:0;border-radius:10px 10px 0 10px;--corner-rgb:0,0,0}
    .plate-layer{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
    }
    .corner-menu{
      --plate-inline:calc(100% - (var(--corner) * .82) - 20px);
      --plate-block:calc(100% - (var(--corner) * .82) - 32px);
      position:absolute;
      width:var(--plate-inline);height:var(--plate-block);
      z-index:0;pointer-events:none;opacity:0;border-radius:12px;
      background:linear-gradient(135deg,rgba(255,255,255,.126),rgba(255,255,255,.0315));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 14px 30px rgba(0,0,0,.30);

      backdrop-filter:blur(18px) saturate(145%);
      -webkit-backdrop-filter:blur(18px) saturate(145%);
      transition:opacity .32s ease,transform .52s cubic-bezier(.16,1,.3,1);
    }
    .corner-menu[data-corner="top-left"]{top:12px;left:4px;right:auto;bottom:auto;transform-origin:top left;transform:scale(.18);background:linear-gradient(135deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.126),rgba(255,255,255,.0315));box-shadow:0 14px 30px rgba(0,0,0,.30)}
    .corner-menu[data-corner="top-right"]{top:12px;right:4px;left:auto;bottom:auto;transform-origin:top right;transform:scale(.18);background:linear-gradient(225deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.126),rgba(255,255,255,.0315));box-shadow:0 14px 30px rgba(0,0,0,.30)}
    .corner-menu[data-corner="bottom-left"]{bottom:12px;left:4px;right:auto;top:auto;transform-origin:bottom left;transform:scale(.18);background:linear-gradient(45deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.126),rgba(255,255,255,.0315));box-shadow:0 -14px 30px rgba(0,0,0,.30)}
    .corner-menu[data-corner="bottom-right"]{bottom:12px;right:4px;left:auto;top:auto;transform-origin:bottom right;transform:scale(.18);background:linear-gradient(315deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.126),rgba(255,255,255,.0315));box-shadow:0 -14px 30px rgba(0,0,0,.30)}
    .corner-menu.open{opacity:1;pointer-events:auto;transform:scale(1)}
    /* Plate size remains automatic. Desktop gets one maximize/restore toggle
       on the Plate corner that faces the center of the screen. */
    .plate-state-toggle{
      position:absolute;z-index:9;
      width:44px;height:44px;padding:0;
      /* Punched-through control: no painted perimeter. The Plate remains
         continuous and only the cut/separator and glyph identify the control. */
      border:0;
      border-radius:0;
      display:grid;place-items:center;pointer-events:auto;
      background:transparent;
      color:rgba(0,0,0,.78);
      box-shadow:none;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      font:600 14px/1.2 'Rajdhani',sans-serif;cursor:pointer;
    }
    .plate-state-toggle:hover{background:transparent;box-shadow:none}
    .plate-state-toggle{
      color:rgba(0,0,0,.28)!important;
      -webkit-text-fill-color:rgba(0,0,0,.28)!important;
      -webkit-text-stroke:0;
      text-shadow:0 1px 0 rgba(255,255,255,.46);
      mix-blend-mode:normal;
      letter-spacing:.04em;
    }
    .plate-state-toggle:focus-visible{outline:1px solid rgba(235,247,255,.50);outline-offset:-2px}
    /* Only the corner pointing inward into the Plate is softened. */
    .corner-menu[data-corner="top-left"] .plate-state-toggle{border-radius:7px 0 0 0}
    .corner-menu[data-corner="top-right"] .plate-state-toggle{border-radius:0 7px 0 0}
    .corner-menu[data-corner="bottom-left"] .plate-state-toggle{border-radius:0 0 0 7px}
    .corner-menu[data-corner="bottom-right"] .plate-state-toggle{border-radius:0 0 7px 0}
    .corner-menu[data-platform="mobile"] .plate-state-toggle{display:none!important}
    /* The control occupies the Prompt track itself, outside content padding.
       Its corner is always the Plate corner nearest the screen center. */
    .corner-menu[data-platform="desktop"][data-corner="top-left"] .plate-state-toggle{right:0;bottom:0}
    .corner-menu[data-platform="desktop"][data-corner="top-right"] .plate-state-toggle{left:0;bottom:0}
    .corner-menu[data-platform="desktop"][data-corner="bottom-left"] .plate-state-toggle{right:0;top:0}
    .corner-menu[data-platform="desktop"][data-corner="bottom-right"] .plate-state-toggle{left:0;top:0}
    .corner-menu[data-platform="desktop"] .plate-state-toggle{visibility:visible!important;opacity:1!important}
    /* Explicit Prompt/Button split: the toggle owns its own 44px cell and a
       single separator edge; the Prompt terminates before that cell. */
    /* Toggle is a nested 44px Prompt-track cell, not an overlay.
       Reserve it in the Prompt row so Prompt and toggle meet edge-to-edge. */
    .corner-menu[data-platform="desktop"] .plate-prompt-wrap{box-sizing:border-box}
    .corner-menu[data-platform="desktop"][data-corner$="-left"] .plate-prompt-wrap{width:calc(100% - 44px);margin-right:44px;padding:0}
    .corner-menu[data-platform="desktop"][data-corner$="-right"] .plate-prompt-wrap{width:calc(100% - 44px);margin-left:44px;padding:0}
    /* Accepted v0.137.9 Plate geometry and animation restored. */
    .haamu-desktop .corner-menu[data-platform="desktop"]{
      /* Owning-corner coordinates are invariant. Only dimensions animate. */
      transition:
        width .30s cubic-bezier(.22,1,.36,1),
        height .30s cubic-bezier(.22,1,.36,1),
        opacity .20s ease;
    }
    .haamu-desktop .corner-menu[data-platform="desktop"][data-plate-state="maximized"]{
      /* Maximize changes dimensions only. Corner-specific normal anchors below
         remain the sole positioning authority. */
      width:calc(100vw - var(--corner) - 38px);
      height:calc(100vh - var(--corner) - 46px);
    }
    /* Every platform plate owns an invisible visual matrix/table.
       Only its outward prompt row is projected; matrix/table lines remain invisible. */
    .plate-matrix{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;pointer-events:none}
    .plate-table{display:contents}
    .plate-row{display:grid;grid-template-columns:1fr;min-width:0;min-height:0}
    .plate-prompt-row{align-items:center}
    .plate-prompt{
      box-sizing:border-box;width:100%;min-width:0;
      border:0!important;outline:0!important;border-radius:0!important;
      background:transparent!important;
      color:rgba(235,247,255,.96);
      -webkit-text-fill-color:rgba(235,247,255,.96);
      box-shadow:none!important;
      backdrop-filter:none;-webkit-backdrop-filter:none;
      font:600 14px/1.2 'Rajdhani',sans-serif;letter-spacing:.04em;
      pointer-events:auto;
      appearance:none;-webkit-appearance:none;
    }
    /* Mobile browsers may inject native input chrome. Suppress every prompt
       edge explicitly so the prompt remains visually part of its Plate. */
    @media(max-width:900px){
      .plate-prompt,.corner-menu.open .plate-prompt{
        border:0!important;outline:0!important;border-radius:0!important;
        box-shadow:none!important;background:transparent!important;
        appearance:none!important;-webkit-appearance:none!important;
      }
    }
    .corner-menu[data-corner^="top-"] .plate-prompt-row{align-self:start}
    .corner-menu[data-corner^="bottom-"] .plate-matrix{grid-template-rows:1fr auto}
    .corner-menu[data-corner$="-left"] .plate-prompt{text-align:left;margin:0 8px;width:calc(100% - 16px);padding:9px 12px}
    .corner-menu[data-corner$="-right"] .plate-prompt{
      direction:ltr !important;
      text-align:left !important;
      unicode-bidi:plaintext;
      margin:0 8px;width:calc(100% - 16px);padding:9px 12px
    }
    .plate-prompt::placeholder{color:transparent!important;-webkit-text-fill-color:transparent;opacity:0!important}
    /* Native caret is hidden. Haamu projects a short narrow cursor whose
       geometry and morph are deterministic across browsers. */
    .plate-prompt{caret-color:transparent}
    .plate-prompt-cursor{
      position:absolute;
      z-index:8;
      width:5px;
      height:9px;
      border-radius:1.5px;
      pointer-events:none;
      display:none;
      opacity:.72;
      background:rgba(255,255,255,.62);
      box-shadow:0 0 4px rgba(255,255,255,.24);
      transform:translateY(-50%);
      animation:haamu-prompt-cursor-morph 1.45s ease-in-out infinite;
    }
    .plate-prompt:focus ~ .plate-prompt-cursor{display:block;opacity:.72}
    @keyframes haamu-prompt-cursor-morph{
      0%,100%{background:rgba(255,255,255,.62);box-shadow:0 0 4px rgba(255,255,255,.24)}
      30%{background:rgba(255,255,255,.42);box-shadow:0 0 3px rgba(255,255,255,.16)}
      58%{background:rgba(32,51,73,.24);box-shadow:0 0 2px rgba(32,51,73,.12)}
      78%{background:rgba(85,170,255,.34);box-shadow:0 0 3px rgba(85,170,255,.15)}
    }
    @media(prefers-reduced-motion:reduce){
      .plate-prompt-cursor{animation:none;background:rgba(255,255,255,.52);box-shadow:none}
    }
    .plate-prompt-wrap{position:relative;display:block;width:100%;height:44px;z-index:5}
    .plate-prompt-label{
      position:absolute;left:20px;top:50%;transform:translateY(-50%);
      z-index:7;display:block!important;visibility:visible!important;opacity:1!important;
      color:rgba(0,0,0,.78)!important;-webkit-text-fill-color:rgba(0,0,0,.78)!important;
      -webkit-text-stroke:0;
      text-shadow:0 1px 0 rgba(255,255,255,.32);
      mix-blend-mode:normal;
      font:600 14px/1.2 'Rajdhani',sans-serif;letter-spacing:.04em;
      pointer-events:none;white-space:nowrap;
    }
    .plate-prompt-wrap.has-value .plate-prompt-label{display:none!important}
    .plate-prompt-wrap .plate-prompt{position:relative;z-index:6}
    .corner-menu[data-platform="mobile"]{display:none}
    .corner-menu[data-platform="desktop"]{display:block}
    .haamu-mobile .corner-menu[data-platform="desktop"]{display:none}
    .haamu-mobile .corner-menu[data-platform="mobile"]{display:block}
    /* Integrated plate composition: Prompt owns input behavior, while Plate
       owns its visual containment. The remaining matrix track is reserved for
       generated Matrix/Grid/Mesh/WebText content. */
    .corner-menu.open .plate-matrix{
      grid-template-rows:1fr 44px;
      padding:0;
      margin:0;
      outline:0;
      box-shadow:none;
      gap:0;
    }
    /* Prompt remains edge-integrated. Only the post-Prompt content track owns
       adaptive internal clearance. Matrix/Grid/Mesh live inside this region. */
    .plate-content-row{
      min-width:0;
      min-height:0;
      overflow:hidden;
      align-self:stretch;
      justify-self:stretch;
    }
    .plate-content-region{
      --plate-content-pad:clamp(3px,.65vmin,7px);
      --plate-content-gap:clamp(1px,.28vmin,3px);
      box-sizing:border-box;
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      margin:auto;
      padding:var(--plate-content-pad);
      display:grid;
      place-self:center;
      align-content:start;
      justify-content:stretch;
      gap:var(--plate-content-gap);
      overflow:auto;
      color:rgba(235,247,255,.96);
      font:500 clamp(12px,1.5vmin,14px)/1.35 'Rajdhani',sans-serif;
      letter-spacing:.02em;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      word-break:break-word;
      pointer-events:auto;
    }
    .plate-content-region:empty{overflow:hidden}
    /* The content track is the plate-owned generation field. Matrix is the
       governing layout; generated grids and meshes occupy this entire track. */
    .corner-menu.open .plate-row:not(.plate-prompt-row){
      min-width:0;min-height:0;width:100%;height:100%;
      grid-template-columns:repeat(var(--plate-grid-columns,1),minmax(0,1fr));
      grid-template-rows:repeat(var(--plate-grid-rows,1),minmax(0,1fr));
    }
    .corner-menu.open[data-corner^="bottom-"] .plate-matrix{
      grid-template-rows:44px 1fr;
    }
    .corner-menu.open[data-corner^="top-"] .plate-content-row{grid-row:1}
    .corner-menu.open[data-corner^="bottom-"] .plate-content-row{grid-row:2}
    .corner-menu.open .plate-prompt-row{
      position:relative;
      inset:auto;
      display:grid;
      height:44px;
      min-height:44px;
      box-sizing:border-box;
      visibility:visible;
      opacity:1;
      transform:none;
    }
    .corner-menu.open[data-corner^="top-"] .plate-prompt-row{
      grid-row:2;
      align-self:stretch;
      transform:none;
    }
    .corner-menu.open[data-corner^="bottom-"] .plate-prompt-row{
      grid-row:1;
      align-self:stretch;
      transform:none;
    }
    .corner-menu.open .plate-prompt{
      display:block;
      visibility:visible;
      opacity:1;
      height:44px;
      margin:0;
      width:100%;
      padding:9px 12px;
      border:0!important;
      outline:0!important;
      border-radius:0;
      background:transparent;
      box-shadow:none!important;
    }
    .corner-menu.open .plate-prompt-label{left:12px}

    /* Prompt is text/input semantics only on every platform. The Plate owns
       every visible surface; desktop and mobile therefore share one projection. */
    .plate-prompt-row,
    .plate-prompt-wrap,
    .plate-prompt,
    .corner-menu.open .plate-prompt-row,
    .corner-menu.open .plate-prompt-wrap,
    .corner-menu.open .plate-prompt{
      border:0!important;
      outline:0!important;
      border-radius:0!important;
      box-shadow:none!important;
      background:transparent!important;
      background-image:none!important;
      filter:none!important;
      -webkit-appearance:none!important;
      appearance:none!important;
    }
    .plate-prompt:focus,
    .plate-prompt:focus-visible{
      border:0!important;
      outline:0!important;
      box-shadow:none!important;
    }

    @media(max-width:600px){
      /* Qualified mobile geometry recovered from eef48b6d...:
         plates remain corner-owned and nearly full-height beneath controls. */
      .corner-menu{
        /* Preserve the owning-corner origin. Only the far edges back off
           from the three non-owning corner controls. */
        --mobile-opposite-clearance:calc(var(--corner) + 24px);
        --mobile-owning-inset:12px;
        --plate-inline:calc(100% - var(--mobile-opposite-clearance) - var(--mobile-owning-inset));
        --plate-block:calc(100% - var(--mobile-opposite-clearance) - var(--mobile-owning-inset));
      }

    .right-pane{grid-area:right}
    .bottom-pane{grid-area:bottom}

    .structural-split.vertical{top:0;bottom:0;left:var(--split-x);width:0}
    .structural-split.horizontal{left:0;right:0;top:var(--split-y);height:0}

    .pane-layer .pane-region{position:absolute;pointer-events:none}
    .pane-layer .pane-left{inset:0 50% 0 0}
    .pane-layer .pane-up{inset:0 0 50% 0}
    .pane-layer .pane-right{inset:0 0 0 50%}
    .pane-layer .pane-down{inset:50% 0 0 0}

      .mobile-compartment.first{inset:0 50% 0 0}
      .mobile-compartment.second{inset:0 0 0 50%}
    }

  </style>

  <script>
    /* Website-scoped freshness boundary. Haamu versions and refreshes only
       Haamu resources; the host browser remains outside Haamu control. */
    (() => {
      const current = document.querySelector('meta[name="haamu-build"]')?.content;
      if (!current) return;
      const key = 'haamu-site-build';
      const seen = sessionStorage.getItem(key);
      const resources = Object.freeze(Array.from(document.scripts)
        .map(script => script.src)
        .filter(Boolean));
      sessionStorage.setItem(key, current);
      window.HaamuBuild = Object.freeze({
        version: current,
        scope: 'website',
        changed: seen !== null && seen !== current,
        resources
      });
    })();
