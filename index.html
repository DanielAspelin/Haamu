<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="haamu-build" content="0.92.0">
  <meta name="description" content="Haamu — open community, technology and culture">
  <title>Haamu</title>
  <style>
    @font-face{
      font-family:'Rajdhani';
      src:url('./fonts/rajdhani/Rajdhani-SemiBold.ttf') format('truetype');
      font-style:normal;
      font-weight:600;
      font-display:swap;
    }
    :root{--haamu-sky:#071019;--haamu-sky-gradient:radial-gradient(circle at 50% 38%,#203349 0,#0c1723 35%,#050b12 78%);color-scheme:dark;background:var(--haamu-sky);color:#f5f7fa}
    *{box-sizing:border-box}
    html,body,#haamu-root{margin:0;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}
    html,body{position:fixed;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;touch-action:manipulation}
    #haamu-root{position:absolute;inset:0;width:auto;height:auto;overflow:visible}
    body{overscroll-behavior:none;background:var(--haamu-sky-gradient),var(--haamu-sky)}
    button{font:inherit}
    .haamu-interface{
      --corner:clamp(52px,5.5vw,76px);
      position:absolute;
      inset:0;
      overflow:visible;
      width:auto;height:auto;min-width:0;min-height:0;display:grid;
      grid-template-columns:var(--corner) 1fr var(--corner);
      grid-template-rows:var(--corner) 1fr var(--corner);
      grid-template-areas:
        "tl top tr"
        "left center right"
        "bl bottom br";
      gap:0;background:var(--haamu-sky-gradient),var(--haamu-sky);
    }
    .haamu-wordmark-layer{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    /* Canonical Haamu text projection shared by mobile and desktop. */
    .haamu-wordmark{
      margin:0;
      font-family:'Rajdhani',sans-serif;
      font-size:clamp(42px,9vw,112px);
      font-style:normal;font-weight:600;
      line-height:1;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#55aaff;
      -webkit-text-fill-color:#55aaff;
      -webkit-text-stroke:3px #fff;
      paint-order:stroke fill;
      filter:
        drop-shadow(0 0 2px rgba(255,255,255,1))
        drop-shadow(0 0 6px rgba(255,255,255,.95))
        drop-shadow(0 0 12px rgba(190,225,255,.92))
        drop-shadow(0 0 24px rgba(80,165,255,.78))
        drop-shadow(0 0 42px rgba(35,105,225,.58));
      text-shadow:
        0 0 1px #fff,
        0 0 4px rgba(255,255,255,1),
        0 0 10px rgba(190,225,255,.95),
        0 0 22px rgba(85,165,255,.82);
      user-select:none;
    }
    /* Mobile keeps the qualified size. Desktop receives its own explicit
       class from the runtime so CSS viewport/input heuristics cannot mask it. */
    .haamu-interface.haamu-desktop .haamu-wordmark{font-size:48px}
    .corner{
      --corner-rgb:0,0,0;
      width:calc(100% - 1mm);height:calc(100% - 1mm);
      opacity:.85;
      border:0;margin:0;cursor:pointer;position:relative;
      border-radius:10px;
      background-color:rgba(var(--corner-rgb),.68);
      background-image:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.06) 42%,rgba(0,0,0,.10));
      /* Body layer only. Aura is independently owned by ::before. */
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.18);
      backdrop-filter:blur(14px) saturate(150%);
      -webkit-backdrop-filter:blur(14px) saturate(150%);
      z-index:3;isolation:isolate;transition:background-color .16s ease,box-shadow .16s ease,filter .16s ease,transform .12s ease;
    }
    /* Independent cold-blue aura layer. It does not participate in button
       sizing/anchoring and can be tuned without changing control geometry. */
    .corner::before{
      content:"";
      display:block;
      position:absolute;
      z-index:-1;
      inset:-5px;
      border-radius:14px;
      pointer-events:none;
      background:rgba(130,190,255,.14);
      box-shadow:
        0 0 10px 4px rgba(190,225,255,.74),
        0 0 22px 8px rgba(85,165,255,.52),
        0 0 38px 13px rgba(35,105,225,.36);
      transform:none;
      animation:none;
      filter:none;
    }
    .corner:hover,.corner:focus-visible{
      background-color:rgba(var(--corner-rgb),.82);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 0 22px rgba(var(--corner-rgb),.28);
      filter:brightness(1.08);
      outline:none;
    }
    .corner:active{transform:scale(.94)}
    .corner{
      animation:haamu-corner-breathe 4.8s linear infinite;
    }
    /* Four equal 1.2 s quarters: green -> yellow -> orange -> purple. */
    .neon-green{animation-delay:0s}
    .lemon-yellow{animation-delay:1.2s}
    .orange{animation-delay:2.4s}
    .purple{animation-delay:3.6s}
    @keyframes haamu-corner-breathe{
      0%,24%{
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
      8%{
        background-color:rgba(var(--corner-rgb),.42);
        filter:brightness(.66);
      }
      16%{
        background-color:rgba(var(--corner-rgb),.98);
        filter:brightness(1.42);
      }
      25%,100%{
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
    }
    .corner.morphing{animation:haamu-corner-morph .58s cubic-bezier(.16,1,.3,1)}
    @keyframes haamu-corner-morph{
      0%{
        transform:scale(1);border-radius:0;
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
      34%{
        transform:scale(.90);border-radius:22%;
        background-color:rgba(var(--corner-rgb),.36);
        filter:brightness(.58);
        box-shadow:inset 0 0 18px rgba(0,0,0,.48);
      }
      70%{
        transform:scale(1.05);border-radius:8%;
        background-color:rgba(var(--corner-rgb),.96);
        filter:brightness(1.48);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 0 28px rgba(var(--corner-rgb),.48);
      }
      100%{
        transform:scale(1);border-radius:0;
        background-color:rgba(var(--corner-rgb),.68);
        filter:brightness(1);
      }
    }
    /* Canonical corner snapping system.
       Grid areas select the corner cell; physical inset properties snap each
       control to that cell's actual corner without transforms or offsets. */
    .corner[data-snap="top-left"]{align-self:start;justify-self:start;inset-block-start:0;inset-inline-start:0}
    .corner[data-snap="top-right"]{align-self:start;justify-self:end;inset-block-start:0;inset-inline-end:0}
    .corner[data-snap="bottom-left"]{align-self:end;justify-self:start;inset-block-end:0;inset-inline-start:0}
    .corner[data-snap="bottom-right"]{align-self:end;justify-self:end;inset-block-end:0;inset-inline-end:0}
    /* Grid-area ownership snaps each full-size control to its corner cell. */
    .neon-green{grid-area:tl;align-self:start;justify-self:start;margin:0;border-radius:0 10px 10px 10px;--corner-rgb:0,0,0}
    .lemon-yellow{grid-area:tr;align-self:start;justify-self:end;margin:0;border-radius:10px 0 10px 10px;--corner-rgb:0,0,0}
    .purple{grid-area:bl;align-self:end;justify-self:start;margin:0;border-radius:10px 10px 10px 0;--corner-rgb:0,0,0}
    .orange{grid-area:br;align-self:end;justify-self:end;margin:0;border-radius:10px 10px 0 10px;--corner-rgb:0,0,0}
    .plate-layer{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
    }
    .corner-menu{
      --plate-inline:calc(100% - (var(--corner) * .82) - 20px);
      --plate-block:calc(100% - (var(--corner) * .82) - 32px);
      position:absolute;
      width:var(--plate-inline);height:var(--plate-block);
      z-index:0;pointer-events:none;opacity:0;border-radius:12px;
      background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 14px 30px rgba(0,0,0,.30);

      backdrop-filter:blur(18px) saturate(145%);
      -webkit-backdrop-filter:blur(18px) saturate(145%);
      transition:opacity .32s ease,transform .52s cubic-bezier(.16,1,.3,1);
    }
    .corner-menu[data-corner="top-left"]{top:12px;left:4px;right:auto;bottom:auto;transform-origin:top left;transform:scale(.18);background:linear-gradient(135deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035));box-shadow:0 14px 30px rgba(0,0,0,.30)}
    .corner-menu[data-corner="top-right"]{top:12px;right:4px;left:auto;bottom:auto;transform-origin:top right;transform:scale(.18);background:linear-gradient(225deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035));box-shadow:0 14px 30px rgba(0,0,0,.30)}
    .corner-menu[data-corner="bottom-left"]{bottom:12px;left:4px;right:auto;top:auto;transform-origin:bottom left;transform:scale(.18);background:linear-gradient(45deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035));box-shadow:0 -14px 30px rgba(0,0,0,.30)}
    .corner-menu[data-corner="bottom-right"]{bottom:12px;right:4px;left:auto;top:auto;transform-origin:bottom right;transform:scale(.18);background:linear-gradient(315deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.82) 24px,rgba(0,0,0,.34) 48px,transparent 72px),linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035));box-shadow:0 -14px 30px rgba(0,0,0,.30)}
    .corner-menu.open{opacity:1;pointer-events:auto;transform:scale(1)}
    @media(max-width:600px){
      /* Qualified mobile geometry recovered from eef48b6d...:
         plates remain corner-owned and nearly full-height beneath controls. */
      .corner-menu{
        /* Preserve the owning-corner origin. Only the far edges back off
           from the three non-owning corner controls. */
        --mobile-opposite-clearance:calc(var(--corner) + 24px);
        --mobile-owning-inset:12px;
        --plate-inline:calc(100% - var(--mobile-opposite-clearance) - var(--mobile-owning-inset));
        --plate-block:calc(100% - var(--mobile-opposite-clearance) - var(--mobile-owning-inset));
      }
      .corner-menu[data-corner="top-left"]{top:var(--mobile-owning-inset);left:var(--mobile-owning-inset)}
      .corner-menu[data-corner="top-right"]{top:var(--mobile-owning-inset);right:var(--mobile-owning-inset)}
      .corner-menu[data-corner="bottom-left"]{bottom:var(--mobile-owning-inset);left:var(--mobile-owning-inset)}
      .corner-menu[data-corner="bottom-right"]{bottom:var(--mobile-owning-inset);right:var(--mobile-owning-inset)}
    }
    @media(max-width:900px) and (orientation:landscape){
      /* Landscape needs a larger horizontal far-edge clearance because the
         short rotated viewport makes the plate visually crowd the opposite
         top control. Keep vertical clearance at the portrait-qualified value. */
      .corner-menu{
        --mobile-landscape-owning-inset:12px;
        --mobile-landscape-opposite-inline-clearance:calc(var(--corner) + 48px);
        --mobile-landscape-opposite-block-clearance:calc(var(--corner) + 24px);
        --plate-inline:calc(100% - var(--mobile-landscape-opposite-inline-clearance) - var(--mobile-landscape-owning-inset));
        --plate-block:calc(100% - var(--mobile-landscape-opposite-block-clearance) - var(--mobile-landscape-owning-inset));
      }
      .corner-menu[data-corner="top-left"]{top:var(--mobile-landscape-owning-inset);left:var(--mobile-landscape-owning-inset)}
      .corner-menu[data-corner="top-right"]{top:var(--mobile-landscape-owning-inset);right:var(--mobile-landscape-owning-inset)}
      .corner-menu[data-corner="bottom-left"]{bottom:var(--mobile-landscape-owning-inset);left:var(--mobile-landscape-owning-inset)}
      .corner-menu[data-corner="bottom-right"]{bottom:var(--mobile-landscape-owning-inset);right:var(--mobile-landscape-owning-inset)}
    }
    @media(min-width:901px){
      .corner-menu{
        --plate-inline:48vw;
        --plate-block:48vh;
      }
    }
    .pane{
      position:relative;border:0;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
      opacity:0;box-shadow:none;background:transparent;
      backdrop-filter:none;-webkit-backdrop-filter:none;
      transition:none;
    }
    .pane:hover,.pane:focus-within{opacity:0}
    .top-pane{grid-area:top}
    .left-pane{grid-area:left}
    .right-pane{grid-area:right}
    .bottom-pane{grid-area:bottom}
    .center{grid-area:center;background:transparent;min-width:0;min-height:0}
    @media(max-width:600px){
      .haamu-interface{
        --corner:min(48px,8.5dvh);
      }
    }
    /* Invisible structural viewport lattice: composition only, never rendered. */
    .haamu-interface{
      --split-x:50%;--split-y:50%;
      --region-full:inset(0);
      --region-left:inset(0 50% 0 0);--region-right:inset(0 0 0 50%);
      --region-top:inset(0 0 50% 0);--region-bottom:inset(50% 0 0);
      --region-top-left:inset(0 50% 50% 0);--region-top-right:inset(0 0 50% 50%);
      --region-bottom-left:inset(50% 50% 0 0);--region-bottom-right:inset(50% 0 0 50%);
    }
    .structural-split{position:absolute;z-index:1;pointer-events:none;visibility:hidden;opacity:0}
    .structural-split.vertical{top:0;bottom:0;left:var(--split-x);width:0}
    .structural-split.horizontal{left:0;right:0;top:var(--split-y);height:0}
    .pane-layer{position:absolute;inset:0;z-index:1;pointer-events:none;visibility:hidden;opacity:0}
    .pane-layer .pane-region{position:absolute;pointer-events:none}
    .pane-layer .pane-left{inset:0 50% 0 0}
    .pane-layer .pane-up{inset:0 0 50% 0}
    .pane-layer .pane-right{inset:0 0 0 50%}
    .pane-layer .pane-down{inset:50% 0 0 0}
    /* Mobile composition has three coincident structural layers:
       whole viewport + two orientation-aware compartments. All are invisible. */
    .mobile-compartment-layer{display:none;position:absolute;inset:0;z-index:1;pointer-events:none;visibility:hidden;opacity:0}
    .mobile-compartment{position:absolute;pointer-events:none}
    .mobile-compartment.whole{inset:0}
    @media(max-width:900px){
      .mobile-compartment-layer{display:block}
      /* Portrait: one horizontal split => upper + lower + whole. */
      .mobile-compartment.first{inset:0 0 50% 0}
      .mobile-compartment.second{inset:50% 0 0 0}
    }
    @media(max-width:900px) and (orientation:landscape){
      /* Rotated mobile: the same split rotates vertical => left + right + whole. */
      .mobile-compartment.first{inset:0 50% 0 0}
      .mobile-compartment.second{inset:0 0 0 50%}
    }
    @media(prefers-reduced-motion:reduce){.corner,.pane,.corner-menu{transition:none}}
  </style>
</head>
<body>
  <i class="structural-split vertical" aria-hidden="true"></i>
  <i class="structural-split horizontal" aria-hidden="true"></i>
  <div class="pane-layer" aria-hidden="true">
    <i class="pane-region pane-left"></i>
    <i class="pane-region pane-up"></i>
    <i class="pane-region pane-right"></i>
    <i class="pane-region pane-down"></i>
  </div>
  <div class="mobile-compartment-layer" aria-hidden="true" data-layer-count="3">
    <i class="mobile-compartment whole" data-compartment="whole"></i>
    <i class="mobile-compartment first" data-compartment="upper-left"></i>
    <i class="mobile-compartment second" data-compartment="lower-right"></i>
  </div>
  <div id="haamu-root"><noscript>Haamu requires JavaScript for its runtime projection.</noscript></div>
  <script src="entry.pre.js"></script>
  <script src="entry.post.js"></script>
  <script src="index.js"></script>
  <script src="default.js"></script>
  <script src="haamu.js"></script>
  <script src="browser.entry.js"></script>
  <script src="browser.js?v=0.92.0"></script>
  <script src="web.entry.js"></script>
  <script src="web.text.js"></script>
  <script src="web.assembly.js"></script>
  <script src="web.gpu.js"></script>
  <script src="web.js"></script>
</body>
</html>
