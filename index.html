<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Haamu — open community, technology and culture">
  <title>Haamu</title>
  <style>
    :root{color-scheme:dark;background:#07090c;color:#f5f7fa}
    *{box-sizing:border-box}
    html,body,#haamu-root{margin:0;width:100%;min-height:100%;height:100%}
    body{overflow:hidden;background:#07090c}
    button{font:inherit}
    .haamu-interface{
      --corner:clamp(52px,5.5vw,76px);
      position:absolute;
      inset:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
      width:auto;height:auto;min-width:0;min-height:0;display:grid;
      grid-template-columns:var(--corner) 1fr var(--corner);
      grid-template-rows:var(--corner) 1fr var(--corner);
      grid-template-areas:
        "tl top tr"
        "left center right"
        "bl bottom br";
      gap:0;background:#07090c;
    }
    .corner{
      border:0;margin:0;cursor:pointer;position:relative;
      background-color:rgba(var(--corner-rgb),.68);
      background-image:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.06) 42%,rgba(0,0,0,.10));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.18);
      backdrop-filter:blur(14px) saturate(150%);
      -webkit-backdrop-filter:blur(14px) saturate(150%);
      z-index:3;transition:background-color .16s ease,box-shadow .16s ease,filter .16s ease,transform .12s ease;
    }
    .corner:hover,.corner:focus-visible{
      background-color:rgba(var(--corner-rgb),.82);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 0 22px rgba(var(--corner-rgb),.28);
      filter:brightness(1.08);
      outline:none;
    }
    .corner:active{transform:scale(.94)}
    .neon-green{grid-area:tl;--corner-rgb:57,255,20}
    .lemon-yellow{grid-area:tr;--corner-rgb:255,244,79}
    .purple{grid-area:bl;--corner-rgb:157,53,255}
    .orange{grid-area:br;--corner-rgb:255,140,26}
    .corner-menu{
      --item:clamp(38px,4.2vw,52px);--gap:9px;
      position:absolute;z-index:2;pointer-events:none;
      display:flex;flex-direction:column;gap:var(--gap);
    }
    .corner-menu[data-corner="top-left"]{top:calc(var(--corner) * .34);left:calc(var(--corner) * .34)}
    .corner-menu[data-corner="top-right"]{top:calc(var(--corner) * .34);right:calc(var(--corner) * .34)}
    .corner-menu[data-corner="bottom-left"]{bottom:calc(var(--corner) * .34);left:calc(var(--corner) * .34);flex-direction:column-reverse}
    .corner-menu[data-corner="bottom-right"]{bottom:calc(var(--corner) * .34);right:calc(var(--corner) * .34);flex-direction:column-reverse}
    .corner-menu-item{
      width:var(--item);height:var(--item);border:0;border-radius:8px;padding:0;
      opacity:0;transform:translate(var(--morph-x),var(--morph-y)) scale(.04);
      background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.045));
      box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.22);
      backdrop-filter:blur(16px) saturate(145%);-webkit-backdrop-filter:blur(16px) saturate(145%);
      transition:opacity .28s ease,transform .48s cubic-bezier(.16,1,.3,1);
      transition-delay:calc(var(--sequence) * 105ms);
    }
    .corner-menu[data-corner="top-left"] .corner-menu-item{--morph-x:calc((var(--sequence) + 1) * (var(--item) + var(--gap)) * -0.72);--morph-y:calc((var(--sequence) + 1) * (var(--item) + var(--gap)) * -1)}
    .corner-menu[data-corner="top-right"] .corner-menu-item{--morph-x:calc((var(--sequence) + 1) * (var(--item) + var(--gap)) * .72);--morph-y:calc((var(--sequence) + 1) * (var(--item) + var(--gap)) * -1)}
    .corner-menu[data-corner="bottom-left"] .corner-menu-item{--morph-x:calc((var(--sequence) + 1) * (var(--item) + var(--gap)) * -0.72);--morph-y:calc((var(--sequence) + 1) * (var(--item) + var(--gap)))}
    .corner-menu[data-corner="bottom-right"] .corner-menu-item{--morph-x:calc((var(--sequence) + 1) * (var(--item) + var(--gap)) * .72);--morph-y:calc((var(--sequence) + 1) * (var(--item) + var(--gap)))}
    .corner-menu.open{pointer-events:auto}
    .corner-menu.open .corner-menu-item{opacity:1;transform:translate(0,0) scale(1)}
    .corner-menu.closing .corner-menu-item{transition-delay:calc((3 - var(--sequence)) * 80ms)}
    @media(max-width:600px){.corner-menu{--item:40px;--gap:7px}}
    .pane{
      position:relative;border:0;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
      opacity:0;box-shadow:none;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      transition:opacity .32s ease;
    }
    .pane:hover,.pane:focus-within{opacity:1}
    .top-pane{grid-area:top}
    .left-pane{grid-area:left}
    .right-pane{grid-area:right}
    .bottom-pane{grid-area:bottom}
    .center{grid-area:center;background:#07090c;min-width:0;min-height:0}
    @media(max-width:600px){.haamu-interface{--corner:48px}}
    @media(prefers-reduced-motion:reduce){.corner,.pane,.corner-menu,.corner-menu-item{transition:none}}
  </style>
</head>
<body>
  <div id="haamu-root"><noscript>Haamu requires JavaScript for its runtime projection.</noscript></div>
  <script src="entry.pre.js"></script>
  <script src="entry.post.js"></script>
  <script src="index.js"></script>
  <script src="default.js"></script>
  <script src="haamu.js"></script>
  <script src="browser.entry.js"></script>
  <script src="browser.js"></script>
  <script src="web.entry.js"></script>
  <script src="web.js"></script>
</body>
</html>
