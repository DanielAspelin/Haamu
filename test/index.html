</style></head><body><main>
<h1>Haamu Projection Space — isolated test</h1>
<p><small>This page does not load or modify the production Haamu Plate runtime.</small></p>
<div class="controls"><button id="explode" type="button">EXPLODE → TEXT</button><button id="gifTest" type="button">TEST GIF → PARTICLES</button><button id="materialize" type="button">MATERIALIZE TEXT</button><button id="colorStream" type="button">COLOR STREAM</button><button id="promptTest" type="button">PARTICLE PROMPT</button><button id="plateCopyTest" type="button">PLATE COPY</button><button id="gifUpload" type="button">UPLOAD GIF</button><button id="reset" type="button">RESET</button><input id="gifFile" type="file" accept="image/gif" hidden><span id="status" aria-live="polite">Projection stable.</span></div>

<script src="../projection.space.js"></script><script>
'use strict';

 el.style.left=node.bounds.x*100+'%';el.style.top=node.bounds.y*100+'%';el.style.width=node.bounds.width*100+'%';el.style.height=node.bounds.height*100+'%';
 el.textContent=node.projectionType+' — '+node.id;surface.insertBefore(el,canvas);elements.push(el);}

function textTargets(count){const r=surface.getBoundingClientRect(),off=document.createElement('canvas'),oc=off.getContext('2d');

 const fontSize=Math.max(34,Math.min(112,off.width*.19));oc.fillStyle='#fff';oc.textAlign='center';oc.textBaseline='middle';oc.font='900 '+fontSize+'px Arial,system-ui,sans-serif';oc.fillText('HAAMU',off.width/2,off.height/2);

function size(){const d=Math.min(2,devicePixelRatio||1),r=surface.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);}

function sampleImage(img){const r=surface.getBoundingClientRect(),off=document.createElement('canvas'),oc=off.getContext('2d',{willReadFrequently:true});off.width=Math.max(1,Math.floor(r.width));off.height=Math.max(1,Math.floor(r.height));const scale=Math.min(off.width/img.width,off.height/img.height)*.72,w=img.width*scale,h=img.height*scale,x=(off.width-w)/2,y=(off.height-h)/2;oc.drawImage(img,x,y,w,h);const data=oc.getImageData(0,0,off.width,off.height).data,out=[],step=2;for(let py=0;py<off.height;py+=step){for(let px=0;px<off.width;px+=step){if(data[(py*off.width+px)*4+3]>48){out.push({x:px,y:py});if(out.length>=12000)break;}}if(out.length>=12000)break;}return out;}
function drawGif(t){if(!gifImg)return;particles=sampleImage(gifImg);const r=surface.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#dce8f5';const phase=(t||performance.now())*.0035;for(const p of particles){const s=1.15,bob=Math.sin(phase+p.x*.035)*2.2,wave=Math.sin(phase*.73+p.y*.045)*1.15,x=p.x+wave,y=p.y+bob;ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath();ctx.fill();}status.textContent='GIF silhouette animated as '+particles.length+' live vector diamond particles.';gifRaf=requestAnimationFrame(drawGif);}
function projectImage(img){restore();size();elements.forEach(e=>e.style.visibility='hidden');gifImg=img;gifRaf=requestAnimationFrame(drawGif);}
function renderPlatePrompt(){const r=platePromptCanvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);platePromptCanvas.width=Math.max(1,Math.round(r.width*d));platePromptCanvas.height=Math.max(1,Math.round(r.height*d));platePctx.setTransform(d,0,0,d,0,0);platePctx.clearRect(0,0,r.width,r.height);const off=document.createElement('canvas'),oc=off.getContext('2d',{willReadFrequently:true});off.width=Math.max(1,Math.floor(r.width));off.height=Math.max(1,Math.floor(r.height));oc.font="600 14px Rajdhani,sans-serif";oc.textBaseline='alphabetic';oc.fillStyle='#fff';const text=platePromptInput.value,leftInset=12,rightInset=leftInset,wrapWidth=Math.max(1,r.width-leftInset-rightInset),anchorBaseline=Math.round(r.height/2+5),lineHeight=17;const lines=[''];for(const ch of text){if(ch==='\n'){lines.push('');continue;}const current=lines[lines.length-1];if(current&&oc.measureText(current+ch).width>wrapWidth)lines.push(ch);else lines[lines.length-1]=current+ch;}const caretIndex=Math.max(0,Math.min(text.length,platePromptInput.selectionStart??text.length));let consumed=0,caretLine=0,caretColumn=0;for(let li=0;li<lines.length;li++){const len=lines[li].length;if(caretIndex<=consumed+len){caretLine=li;caretColumn=Math.max(0,caretIndex-consumed);break;}consumed+=len;if(text[consumed]==='\n')consumed++;caretLine=Math.min(li+1,lines.length-1);caretColumn=lines[caretLine]?.length||0;}const visibleStart=Math.max(0,lines.length-3),baselineShift=visibleStart*lineHeight;for(let li=visibleStart;li<lines.length;li++)oc.fillText(lines[li],leftInset,anchorBaseline+(li*lineHeight)-baselineShift);const metricSample=lines[caretLine]||text||'Hg',metrics=oc.measureText(metricSample),ascent=metrics.actualBoundingBoxAscent||11,descent=metrics.actualBoundingBoxDescent||3,caretBaseline=anchorBaseline+(caretLine*lineHeight)-baselineShift,textTop=caretBaseline-ascent,textBottom=caretBaseline+descent,textHeight=textBottom-textTop,caretBaseHeight=textHeight*1.025,caretMorph=.45+.575*((Math.sin(curs function openPlateCopy(){restore();elements.forEach(e=>e.style.visibility='hidden');plateCopy.hidden=false;platePromptInput.value='';platePromptInput.focus();cursorPhase=0;const animateCursor=()=>{if(plateCopy.hidden)return;cursorPhase+=.045;renderPlatePrompt();cursorRaf=requestAnimationFrame(animateCursor);};document.fonts.ready.then(()=>{renderPlatePrompt();cursorRaf=requestAnimationFrame(animateCursor);});}
function renderParticlePrompt(){const r=promptBox.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);promptCanvas.width=Math.max(1,Math.round(r.width*d));promptCanvas.height=Math.max(1,Math.round(r.height*d));pctx.setTransform(d,0,0,d,0,0);pctx.clearRect(0,0,r.width,r.height);const off=document.createElement('canvas'),oc=off.getContext('2d',{willReadFrequently:true});off.width=Math.max(1,Math.floor(r.width));off.height=Math.max(1,Math.floor(r.height));oc.font="600 24px Rajdhani,sans-serif";oc.textBaseline='middle';oc.fillStyle='#fff';const text=particleInput.value,baseline=r.height/2;oc.fillText(text,12,baseline);const caretX=Math.min(r.width-3,12+oc.measureText(text).width+2);oc.fillRect(caretX,baseline-12,2,24);const data=oc.getImageData(0,0,off.width,off.height).data;pctx.fillStyle='#dce8f5';let n=0;for(let y=0;y<off.height;y+=1)for(let x=0;x<off.width;x+=1){const a=data[(y*off.width+x)*4+3];if(a>8){const s=.76;pctx.globalAlpha=Math.max(.18,a/255);pctx.beginPath();pctx.moveTo(x,y-s);pctx.lineTo(x+s,y);pctx.lineTo(x,y+s);pctx.lineTo(x-s,y);pctx.closePath();pctx.fill();if(++n>=12000)break;}if(n>=12000)break;}pctx.globalAlpha=1;status.textContent='Rajdhani prompt projected as '+n+' vector diamond particles; cursor included.';}

function streamColor(){restore();size();const r=surface.getBoundingClientRect(),targets=textTargets(5200),begun=performance.now();particles=targets.map((p,i)=>({x:p.x,y:p.y,phase:(i%251)/251*Math.PI*2}));elements.forEach(e=>e.style.visibility='hidden');function frame(t){const time=(t-begun)/1000;ctx.clearRect(0,0,r.width,r.height);for(const p of particles){const hue=(time*72+p.x*.38+p.y*.16+p.phase*28)%360,s=1.15;ctx.fillStyle='hsl('+hue+' 88% 72%)';ctx.beginPath();ctx.moveTo(p.x,p.y-s);ctx.lineTo(p.x+s,p.y);ctx.lineTo(p.x,p.y+s);ctx.lineTo(p.x-s,p.y);ctx.closePath();ctx.fill();}status.textContent='HAAMU color stream: '+particles.length+' independently colored vector particles.';colorRaf=requestAnimationFrame(frame);}colorRaf=requestAnimationFrame(frame);}

promptTest.addEventListener('click',openParticlePrompt);
plateCopyTest.addEventListener('click',openPlateCopy);
