<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haamu Projection Test</title><style>
html,body{margin:0;min-height:100%;background:#0b111b;color:#dce8f5;font:14px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:auto;padding:24px}h1{font-size:20px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
button{min-height:44px;padding:0 18px;background:#15263a;color:inherit;border:1px solid #789;border-radius:4px;font:inherit}
button:disabled{opacity:.45}#status{opacity:.8}
#surface{position:relative;aspect-ratio:16/9;border:1px solid #567;overflow:hidden;background:#101b2b}
.node{position:absolute;box-sizing:border-box;border:1px solid currentColor;padding:8px;overflow:hidden}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
pre{white-space:pre-wrap;overflow-wrap:anywhere}small{opacity:.75}
</style></head><body><main>
<h1>Haamu Projection Space — isolated test</h1>
<p><small>This page does not load or modify the production Haamu Plate runtime.</small></p>
<div class="controls"><button id="explode" type="button">EXPLODE → TEXT</button><button id="gifTest" type="button">GIF → PARTICLES</button><button id="reset" type="button">RESET</button><input id="gifFile" type="file" accept="image/gif" hidden><span id="status" aria-live="polite">Projection stable.</span></div>
<div id="surface" aria-label="Experimental projection surface"><canvas id="particles"></canvas></div>
<pre id="evidence"></pre></main>
<script src="../projection.space.js"></script><script>
'use strict';
const surface=document.getElementById('surface'),canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
const evidence=document.getElementById('evidence'),explode=document.getElementById('explode'),gifTest=document.getElementById('gifTest'),gifFile=document.getElementById('gifFile'),reset=document.getElementById('reset'),status=document.getElementById('status');
const P=globalThis.HaamuProjectionSpace;
const space=P.create({id:'test-space',plate:{id:'test-only',x:0,y:0,width:surface.clientWidth,height:surface.clientHeight}});
const nodes=[
 P.node(space,{id:'text',projectionType:'text',bounds:{x:.05,y:.08,width:.42,height:.22},data:'Text projection',grid:{columns:32,rows:8}}),
 P.node(space,{id:'plot',projectionType:'plot',bounds:{x:.52,y:.08,width:.43,height:.38},data:[1,4,2,7,5],interactive:true}),
 P.node(space,{id:'tree',projectionType:'tree',bounds:{x:.05,y:.55,width:.42,height:.35},mesh:{topology:'tree',nodes:['root','a','b'],edges:[['root','a'],['root','b']]}}),
 P.node(space,{id:'mind',projectionType:'mind-map',bounds:{x:.52,y:.55,width:.43,height:.35},mesh:{topology:'graph',nodes:['Haamu','Matrix','Mesh'],edges:[['Haamu','Matrix'],['Haamu','Mesh']]},interactive:true})
];
const elements=[];
for(const node of nodes){const el=document.createElement('div');el.className='node';el.dataset.projectionType=node.projectionType;
 el.style.left=node.bounds.x*100+'%';el.style.top=node.bounds.y*100+'%';el.style.width=node.bounds.width*100+'%';el.style.height=node.bounds.height*100+'%';
 el.textContent=node.projectionType+' — '+node.id;surface.insertBefore(el,canvas);elements.push(el);}
let particles=[],raf=0,start=0,running=false;
function textTargets(count){const r=surface.getBoundingClientRect(),off=document.createElement('canvas'),oc=off.getContext('2d');
 off.width=Math.max(1,Math.floor(r.width));off.height=Math.max(1,Math.floor(r.height));oc.clearRect(0,0,off.width,off.height);
 const fontSize=Math.max(34,Math.min(112,off.width*.19));oc.fillStyle='#fff';oc.textAlign='center';oc.textBaseline='middle';oc.font='900 '+fontSize+'px Arial,system-ui,sans-serif';oc.fillText('HAAMU',off.width/2,off.height/2);
 const data=oc.getImageData(0,0,off.width,off.height).data,pts=[],step=Math.max(1,Math.floor(off.width/360));
 for(let y=0;y<off.height;y+=step)for(let x=0;x<off.width;x+=step)if(data[(y*off.width+x)*4+3]>32)pts.push({x,y});
 if(!pts.length)return Array.from({length:count},()=>({x:r.width/2,y:r.height/2}));
 return Array.from({length:count},(_,i)=>pts[Math.min(pts.length-1,Math.floor(i*pts.length/count))]);}
function size(){const d=Math.min(2,devicePixelRatio||1),r=surface.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);}
function build(){const sr=surface.getBoundingClientRect(),out=[];elements.forEach((el,group)=>{const r=el.getBoundingClientRect(),step=Math.max(7,Math.min(13,r.width/24));
 for(let y=step/2;y<r.height;y+=step)for(let x=step/2;x<r.width;x+=step){const px=r.left-sr.left+x,py=r.top-sr.top+y,a=(group+1)*2.399+x*.071+y*.113;
  out.push({x:px,y:py,ox:px,oy:py,vx:Math.cos(a)*(55+((x+y)%75)),vy:Math.sin(a)*(55+((x*2+y)%75)),s:Math.max(1.2,step*.22)});}});
 return out.slice(0,12000);}
function draw(t){const r=surface.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);const elapsed=(t-start)/1000;
 const out=Math.min(1,elapsed/1.05),into=Math.max(0,Math.min(1,(elapsed-1.05)/1.55)),ease=into*into*(3-2*into);ctx.fillStyle='#dce8f5';
 particles.forEach(p=>{const ex=p.ox+p.vx*out,ey=p.oy+p.vy*out+80*out*out;p.x=ex+(p.tx-ex)*ease;p.y=ey+(p.ty-ey)*ease;const s=1.15;ctx.beginPath();ctx.moveTo(p.x,p.y-s);ctx.lineTo(p.x+s,p.y);ctx.lineTo(p.x,p.y+s);ctx.lineTo(p.x-s,p.y);ctx.closePath();ctx.fill();});
 if(elapsed<2.6){raf=requestAnimationFrame(draw);}else{running=false;explode.disabled=false;status.textContent='HAAMU formed from particles. Press RESET to restore the projection.';}}
function finish(){cancelAnimationFrame(raf);raf=0;running=false;ctx.clearRect(0,0,canvas.width,canvas.height);elements.forEach(e=>e.style.visibility='visible');explode.disabled=false;status.textContent='Projection reconstructed.';}
function run(){if(running)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){status.textContent='Reduced motion is enabled; projection remains stable.';return;}
 size();particles=build();const targets=textTargets(particles.length);particles.forEach((p,i)=>{p.tx=targets[i].x;p.ty=targets[i].y;});elements.forEach(e=>e.style.visibility='hidden');running=true;explode.disabled=true;status.textContent='Projection exploded into '+particles.length+' particles; implosion target: HAAMU.';start=performance.now();raf=requestAnimationFrame(draw);}
function restore(){finish();status.textContent='Projection reset.';}
function projectImage(img){restore();size();const r=surface.getBoundingClientRect(),off=document.createElement('canvas'),oc=off.getContext('2d',{willReadFrequently:true});off.width=Math.max(1,Math.floor(r.width));off.height=Math.max(1,Math.floor(r.height));const scale=Math.min(off.width/img.width,off.height/img.height)*.72,w=img.width*scale,h=img.height*scale,x=(off.width-w)/2,y=(off.height-h)/2;oc.clearRect(0,0,off.width,off.height);oc.drawImage(img,x,y,w,h);const data=oc.getImageData(0,0,off.width,off.height).data;particles=[];const step=2;for(let py=0;py<off.height;py+=step)for(let px=0;px<off.width;px+=step){const i=(py*off.width+px)*4,a=data[i+3];if(a>48){particles.push({x:px,y:py,s:1.15});if(particles.length>=12000)break;}if(particles.length>=12000)break;}elements.forEach(e=>e.style.visibility='hidden');ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#dce8f5';for(const p of particles){const s=1.15;ctx.beginPath();ctx.moveTo(p.x,p.y-s);ctx.lineTo(p.x+s,p.y);ctx.lineTo(p.x,p.y+s);ctx.lineTo(p.x-s,p.y);ctx.closePath();ctx.fill();}status.textContent='GIF frame projected as '+particles.length+' vector diamond particles.';}
gifTest.addEventListener('click',()=>gifFile.click());
gifFile.addEventListener('change',()=>{const file=gifFile.files&&gifFile.files[0];if(!file)return;if(file.type!=='image/gif'){status.textContent='Select a GIF file.';return;}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{projectImage(img);URL.revokeObjectURL(url);};img.onerror=()=>{URL.revokeObjectURL(url);status.textContent='GIF could not be decoded by this browser.';};img.src=url;});
explode.addEventListener('click',run);reset.addEventListener('click',restore);addEventListener('resize',()=>{if(!running)size();},{passive:true});size();
evidence.textContent=JSON.stringify({test:true,productionPlateLoaded:false,projectionVersion:P.version,renderer:'test-vector-diamond-particle-adapter-v4',particleLimit:12000,particlePrimitive:'vector-diamond',particleRadius:1.15,gifInput:'browser-decoded-frame',formation:'HAAMU',
 space:{id:space.id,resolution:space.resolution,plateAuthority:space.plate.authority},nodes:nodes.map(n=>({id:n.id,type:n.projectionType,bounds:n.bounds,rendererConnected:n.rendererConnected}))},null,2);
</script></body></html>
